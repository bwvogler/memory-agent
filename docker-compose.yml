# Local development. Runs a real Postgres so you can exercise TigerFS without
# a cloud account.
#
# NOTE the cap_add and devices stanzas: without them the FUSE mount fails and
# nothing else works. This is the same requirement that rules out several
# managed hosts in production.
services:
  db:
    # 18+, not 16: TigerFS builds its workspace table with uuidv7(), which
    # older Postgres does not have. On 16 the mount comes up and then every
    # workspace creation fails.
    #
    # pgvector/, not plain postgres/: app/search.py's dense half needs the
    # `vector` extension, which the official postgres image does not ship.
    # Same base image, same entrypoint, same uuidv7() support. Production is
    # Neon, which ships pgvector 0.8.0 on every plan. Without this the stack
    # still WORKS - search degrades to lexical-only and says so at /healthz -
    # which is the local/prod divergence the container tier's search probe
    # exists to catch.
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: kb
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
      KB_DATABASE_URL: postgres://postgres:devpassword@db:5432/kb
      SESSION_DATABASE_URL: postgres://postgres:devpassword@db:5432/kb
      # Local only. Skips Cloudflare Access entirely and fakes a user.
      DEV_BYPASS_AUTH: "1"
      DEV_FAKE_EMAIL: dev@localhost
      # The dev Postgres above serves no TLS, which TigerFS otherwise requires.
      KB_INSECURE_NO_SSL: "1"
      # Unset locally is fine and is the default: lexical-only search, no
      # outbound call. `:-` not `:?` - an unset key must not refuse to start
      # the stack, unlike ANTHROPIC_API_KEY above.
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    ports: ["8080:8080"]
    cap_add: ["SYS_ADMIN"]
    devices: ["/dev/fuse"]
    security_opt: ["apparmor:unconfined"]
    volumes:
      # Mirrors the Fly volume in fly.toml. Without this, /work lives in the
      # container's writable layer and the bead graph and savepoint history are
      # destroyed by any rebuild - not just `down -v`.
      - work:/work

volumes:
  work:
