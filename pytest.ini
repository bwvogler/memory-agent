[pytest]
testpaths = tests
addopts = -ra

# Both slow tiers are opt-in. A bare `pytest` runs only the fast unit tests and
# needs no Docker, no database and no API key.
#
#   pytest                          fast units only (~1s)
#   pytest --container              + the Docker smoke tier (~3 min, no API key)
#   pytest --container --live       + one real agent turn (spends tokens)
#
# --live implies --container; the live turn needs the stack.
markers =
    container: requires a running Docker stack (slow, no API key needed)
    live: spends real tokens against the Anthropic API
