[pytest]
testpaths = tests
addopts = -ra

# Both slow tiers are opt-in. A bare `pytest` runs only the fast unit tests and
# needs no Docker, no database and no API key.
#
#   pytest                          fast units only (~1s)
#   pytest --container              + the Docker smoke tier (~3 min, no API key)
#   pytest --container --live       + one real agent turn (spends tokens)
#
# --live implies --container; the live turn needs the stack.
markers =
    container: requires a running Docker stack (slow, no API key needed)
    live: spends real tokens against the Anthropic API

# Importing FastMCP (app/mcp_server.py) makes pydantic-settings inspect a
# FastAPI field whose annotation is a forward reference, and it warns about it
# on every single run. Nothing here can fix it and a warning nobody can act on
# is how a team learns to stop reading test output. Scoped to that one class so
# a warning we CAN act on still shows up.
filterwarnings =
    ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning
