# Static checks only, and deliberately nothing else.
#
# The test suite is not here. The fast tier would be affordable, but the
# --container tier builds the real image and stands up Postgres + FUSE, and a
# commit hook that takes minutes gets bypassed with --no-verify until it may as
# well not exist. Tests run in CI, where blocking a merge is the right lever.
#
#   pip install pre-commit && pre-commit install
#
# Versions are pinned to match .github/workflows/ci.yml and
# requirements-dev.txt. Change all three together, or the hook passes what CI
# then rejects.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        # Whole-project check: types are not a per-file property, so passing
        # only the staged files would miss every error a change causes
        # somewhere else.
        entry: uvx ty@0.0.71 check app tests
        language: system
        pass_filenames: false
        types: [python]
