# Fly is the reference host because it is the only cheap option that gives all
# four of: unrestricted /dev/fuse, a persistent rootfs and volume, HTTP-triggered
# wake with sub-second resume, and no CPU/RAM billing while suspended.
# See docs/decisions/0002-choosing-a-host.md for the alternatives and why not.
app = "memory-agent-proud-island-3747"

# Put this in the SAME region as your Postgres. TigerFS turns every ls/cat/grep
# into SQL, so cross-region latency is the difference between an agent that
# feels sharp and one that feels broken.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  KB_MOUNT = "/mnt/kb"
  WORK_DIR = "/work"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  # Long agent turns: do not let the proxy give up while the model is thinking.
  # The SSE heartbeat keeps bytes flowing, which is the real protection.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/healthz"

# Suspend requires <= 2GB RAM, and we are exactly at the ceiling. Sizing up
# loses sub-second resume, so measure peak RSS before you do.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

# Scratch space and the SDK's local session files. Not the knowledge base -
# that lives in Postgres.
#
# It also holds the bead ledger and kb.git, which is why this deployment runs
# exactly ONE active machine. A second machine gets its own ledger and its own
# savepoint history while sharing the knowledge base, so `bd ready` diverges,
# memory/backlog.md becomes a fight between two ledgers, and a revert routed to
# the wrong machine finds no savepoint for a turn whose writes are right there
# in the shared KB. Do not `fly scale count`. min_machines_running = 0 above is
# one machine that suspends, not zero machines.
#
# Read docs/decisions/0009 before changing this - including the part about
# fixing savepoint isolation first, since the concurrency ceiling is shared
# state rather than hardware.
[mounts]
  source = "memory_agent_work"
  destination = "/work"
