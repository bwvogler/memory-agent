<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memory-agent</title>
<style>
  :root {
    --bg: #fbfbf9; --panel: #fff; --ink: #1a1a18; --muted: #6b6b66;
    --line: #e4e4df; --accent: #3d5a80; --tool: #7a6a55; --err: #a4342b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614; --panel: #1e1e1b; --ink: #ece9e4; --muted: #9a968e;
      --line: #33322e; --accent: #8fb0d4; --tool: #c0a882; --err: #e2857c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header a.nav { color: var(--muted); font-size: 13px; text-decoration: none; }
  header a.nav:hover { color: var(--accent); }
  .who { color: var(--muted); font-size: 13px; margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #4a8f5b; } .dot.bad { background: var(--err); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 14px; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 4px; }
  .msg .body {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px;
  }
  .msg .body p { margin: 0; white-space: pre-wrap; word-wrap: break-word; }
  .msg .body p + p { margin-top: 0.6em; }
  .msg.me .body { background: transparent; border-style: dashed; }
  .tool { color: var(--tool); font-size: 13px; font-style: italic; margin: 4px 0; }
  .err { color: var(--err); }
  .revert {
    font: inherit; font-size: 12px; margin-top: 6px; padding: 3px 9px;
    border: 1px solid var(--line); border-radius: 5px; background: var(--panel);
    color: var(--muted); cursor: pointer;
  }
  .revert:hover:not(:disabled) { color: var(--err); border-color: var(--err); }
  .revert:disabled { opacity: .5; cursor: default; }
  .thinking { display: flex; gap: 5px; align-items: center; padding: 2px 0; }
  .thinking span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .thinking span:nth-child(2) { animation-delay: .2s; }
  .thinking span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: .25; transform: scale(.75); }
    40% { opacity: 1; transform: scale(1); }
  }
  footer { border-top: 1px solid var(--line); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; font: inherit; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.send {
    font: inherit; padding: 0 18px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <span class="dot" id="health" title="knowledge base mount"></span>
  <h1>memory-agent</h1>
  <a class="nav" href="/kb">Knowledge Base →</a>
  <span class="who" id="who">…</span>
</header>

<main><div class="wrap" id="log"></div></main>

<footer>
  <form id="form">
    <textarea id="input" rows="2" placeholder="Ask, or tell it something worth remembering…"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
  <div class="hint" id="hint"></div>
</footer>

<script>
// State lives on the server: a turn is submitted, then streamed. A dropped
// connection replays from Last-Event-ID rather than losing the turn, so closing
// a laptop mid-answer costs nothing.
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const hint = document.getElementById('hint');
let sessionId = null;

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function scroll() { const m = document.querySelector('main'); m.scrollTop = m.scrollHeight; }

function addMessage(role, cls) {
  const wrap = el('div', 'msg ' + (cls || ''));
  wrap.appendChild(el('div', 'role', role));
  const body = el('div', 'body', '');
  wrap.appendChild(body);
  log.appendChild(wrap);
  scroll();
  return { wrap, body };
}

async function boot() {
  try {
    const me = await (await fetch('/api/me')).json();
    document.getElementById('who').textContent = me.email;
  } catch { document.getElementById('who').textContent = 'not signed in'; }
  try {
    const h = await (await fetch('/healthz')).json();
    const dot = document.getElementById('health');
    dot.classList.add(h.kb_mounted ? 'ok' : 'bad');
    dot.title = h.kb_mounted ? 'knowledge base mounted' : 'KNOWLEDGE BASE NOT MOUNTED';
    if (!h.kb_mounted) hint.textContent = 'Warning: the knowledge base is not mounted — answers will not use it.';
  } catch {}
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send.disabled = true;
  send.textContent = 'Working…';
  addMessage('you', 'me').body.textContent = text;

  let turnId;
  try {
    const res = await fetch('/api/turns', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    if (!res.ok) throw new Error('submit failed: ' + res.status);
    turnId = (await res.json()).turn_id;
  } catch (err) {
    addMessage('error', '').body.classList.add('err');
    log.lastChild.querySelector('.body').textContent = String(err);
    send.disabled = false;
    return;
  }
  stream(turnId);
});

function stream(turnId) {
  const msg = addMessage('agent', '');

  // Pulsing indicator while the agent is working.
  const thinking = el('div', 'thinking');
  for (let i = 0; i < 3; i++) thinking.appendChild(el('span'));
  msg.body.appendChild(thinking);

  const es = new EventSource('/api/turns/' + turnId + '/events');
  let hasText = false;
  let hasTextDelta = false; // true once the CLI streams at least one token
  let currentPara = null;   // the <p> currently receiving streamed tokens
  let newParaNext = true;   // start a fresh <p> on the next text chunk

  function appendText(raw) {
    if (!hasText) { hasText = true; thinking.remove(); }
    if (newParaNext) {
      currentPara = el('p', '');
      msg.body.appendChild(currentPara);
      newParaNext = false;
    }
    currentPara.textContent += raw.replace(/\\n/g, '\n');
    scroll();
  }

  // Token-by-token streaming (requires --include-partial-messages support).
  es.addEventListener('text_delta', (e) => { hasTextDelta = true; appendText(e.data); });
  // Full-turn text from AssistantMessage — used when streaming isn't available,
  // ignored if text_delta already delivered the content.
  es.addEventListener('text', (e) => {
    if (!hasTextDelta) { newParaNext = true; appendText(e.data); }
  });

  es.addEventListener('tool', (e) => {
    newParaNext = true;   // next text starts a new paragraph
    const name = e.data;
    const label = { Bash: 'bash', Read: 'read', Write: 'write', Edit: 'edit',
                    Glob: 'glob', Grep: 'grep', WebSearch: 'web search',
                    WebFetch: 'web fetch' }[name] || name.toLowerCase();
    const t = el('div', 'tool', '→ ' + label);
    const revert = msg.wrap.querySelector('.revert');
    msg.wrap.insertBefore(t, revert || null);
    scroll();
  });
  es.addEventListener('session', (e) => { sessionId = e.data; });
  es.addEventListener('status', () => {});

  const finish = (failed, detail) => {
    thinking.remove();   // no-op if already gone
    es.close();
    send.disabled = false;
    send.textContent = 'Send';
    if (failed) {
      const n = el('div', 'body err', detail || 'the turn failed');
      msg.wrap.appendChild(n);
    }
    // Every turn is wrapped in a TigerFS savepoint, so reverting is atomic
    // — and the undo is itself reversible.
    const btn = el('button', 'revert', 'Revert this turn');
    btn.onclick = async () => {
      btn.disabled = true;
      btn.textContent = 'Reverting…';
      const r = await fetch('/api/turns/' + turnId + '/revert', { method: 'POST' });
      btn.textContent = r.ok ? 'Reverted' : 'Revert failed';
    };
    msg.wrap.appendChild(btn);
    scroll();
  };

  es.addEventListener('done', () => finish(false));
  es.addEventListener('failed', (e) => finish(true, e.data));
  es.onerror = () => {
    // EventSource reconnects on its own and the server replays from
    // Last-Event-ID, so a transient drop needs no handling here.
    if (es.readyState === EventSource.CLOSED) finish(true, 'connection closed');
  };
}

boot();
</script>
</body>
</html>
