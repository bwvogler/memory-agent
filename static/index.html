<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>memory-agent</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <span class="dot" id="health" title="knowledge base mount"></span>
  <h1>memory-agent</h1>
  <span class="who" id="who">…</span>
</header>

<div class="layout" id="layout">
  <nav id="nav">
    <div class="nav-header">
      <span class="nav-title" data-path="AGENT_GUIDE.md" onclick="openAgentGuide()">Files</span>
      <button class="refresh" onclick="loadFiles()" title="Refresh">↻</button>
    </div>
    <div id="file-list"><div class="empty">Loading…</div></div>
  </nav>
  <div class="gutter" id="gutter-tree" role="separator" aria-orientation="vertical" aria-label="Resize the file tree"></div>

  <main><div class="prose" id="content"><div class="empty">Select a file.</div></div></main>
  <div class="gutter" id="gutter-chat" role="separator" aria-orientation="vertical" aria-label="Resize the chat panel"></div>

  <aside id="chat">
    <div class="chat-header">
      <select id="conversation-picker" title="Conversations"></select>
      <button class="new-chat" id="new-chat" type="button" title="New chat">+ New</button>
    </div>
    <div class="chat-log" id="log"></div>
    <div class="composer">
      <form id="form">
        <div class="img-previews" id="previews"></div>
        <div class="input-row">
          <textarea id="input" rows="2" placeholder="Ask, or tell it something worth remembering…"></textarea>
          <input type="file" id="filepicker" multiple hidden>
          <button class="attach" id="attach" type="button" title="Attach files">📎</button>
          <button class="stop" id="stop" type="button" title="Stop this turn" hidden>Stop</button>
          <button class="send" id="send" type="submit">Send</button>
        </div>
      </form>
      <div class="hint" id="hint"></div>
    </div>
  </aside>
</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
